[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teo"
version = "0.1.0"
description = "Forecasting & self-healing sidecar for the xau-scalper trading dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "numpy>=1.26",
    # Lower bounds pin transitive deps above known CVEs (pip-audit). The
    # sidecar is localhost-only, but these cost nothing to floor.
    "cryptography>=50.0.0",
    "pydantic-settings>=2.14.2",
    "click>=8.3.3",
    "msgpack>=1.2.1",
    "pygments>=2.20.0",
    "pynacl>=1.6.2",
    "setuptools>=83.0.0",
]

[project.optional-dependencies]
# Real Kronos inference. Optional so the service runs and tests without heavy ML deps.
#
# The architecture itself is vendored at teo/vendor/kronos (MIT), NOT installed from
# PyPI: `kronos-model-arch` hard-pins matplotlib, einops, huggingface_hub and tqdm to
# exact versions its plotting examples want, none of which the model code imports.
# These are the deps the vendored source actually uses, unpinned.
kronos = [
    "torch>=2.2",
    "einops>=0.7",
    "tqdm>=4.66",
    "huggingface-hub>=0.23",
    "safetensors>=0.4",
    "pandas>=2.2",
]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["teo*"]

[tool.setuptools.package-data]
"teo.vendor.kronos" = ["LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"
# Vendored upstream source is kept byte-identical to its origin (bar one import
# rewrite) so it can be re-synced from upstream cheaply. Reformatting it to our
# house style would make every future update a merge conflict.
extend-exclude = ["teo/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
